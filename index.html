<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// Seating unit sizes in metres, from the drawing (cm / 100).
const S = {
  sofaR: 1.30, seatIn: 0.75, backIn: 0.60, plinthIn: 0.62, plinthOut: 1.25,
  plinthTop: 0.08, seatBaseTop: 0.30, seatTop: 0.42, backTop: 0.75, rim: 0.85, soil: 0.79,

};
// Mall layout (metres). Ground floor at y=0, origin at the centre of the seating unit.
const B = {x0: -19, x1: 19, z0: -15, z1: 14};            // building footprint
const VOID = {x0: -13.95, x1: 13.95, z0: -8, z1: 8};        // atrium opening
const L1 = {under: 4.6, top: 5.2};                         // first-floor slab
const RF = {under: 9.6, top: 11.0};                        // roof slab over the galleries
const SKY_Y = 14.4;                                        // skylight level

// ------------------------------------------------------------ helpers
const rng = (s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261110);
const R = (a, b) => a + (b - a) * rng();
const clamp = THREE.MathUtils.clamp;
const deg = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const isSmall = Math.min(innerWidth, innerHeight) < 700 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: false});
renderer.setPixelRatio(Math.min(devicePixelRatio, isSmall ? 1.5 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true; // static scene: bake shadows once
stage.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
let dirty = true;

const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none'; labels.domElement.dir = 'ltr';
stage.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9c4e6');
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 900);
camera.rotation.order = 'YXZ';
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = roomEnv;

// ------------------------------------------------------------ textures
const loader = new THREE.TextureLoader();
const msg = document.getElementById('loadMsg');
function loadTex(url, {srgb = true, repeat = null, mirror = false} = {}){
  return new Promise(res => loader.load(url, t => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = maxAniso;
    if (repeat){ t.wrapS = t.wrapT = mirror ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping; t.repeat.set(...repeat); }
    res(t);
  }, undefined, () => res(null)));
}
const [shopT1, shopT2, shopT3, skyT, marbleT, rugT] = await Promise.all([
  loadTex('tex/shop1.jpg'), loadTex('tex/shop2.jpg'), loadTex('tex/shop3.jpg'), loadTex('tex/sky.jpg'),
  loadTex('tex/marble_tiles.jpg', {repeat: [1, 1], mirror: true}), loadTex('tex/rug.jpg'),
]);
msg.textContent = 'جاري بناء المشهد…';
await new Promise(r => setTimeout(r, 30));

function canvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, {srgb = true, repeat = [1, 1]} = {}){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = maxAniso;
  return t;
}
function wrapDraw(size, x, y, pad, fn){
  for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]){
    if (x + ox < -pad || x + ox > size + pad || y + oy < -pad || y + oy > size + pad) continue;
    fn(x + ox, y + oy);
  }
}
function grain(x, w, h, amt){
  const d = x.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4){ const n = (rng() - 0.5) * amt; a[i] += n; a[i+1] += n; a[i+2] += n; }
  x.putImageData(d, 0, 0);
}
function boucleBump(){
  const N = 512, [c, x] = canvas(N, N);
  x.fillStyle = '#808080'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 9000; i++){
    const px = R(0, N), py = R(0, N), r = R(1.6, 4), g = Math.round(R(55, 215)), a0 = R(0, 6.28);
    x.strokeStyle = `rgba(${g},${g},${g},${R(.35, .85).toFixed(2)})`; x.lineWidth = R(1.3, 2.6);
    wrapDraw(N, px, py, 8, (X, Y) => { x.beginPath(); x.arc(X, Y, r, a0, a0 + R(3.5, 6.28)); x.stroke(); });
  }
  return tex(c, {srgb: false});
}
function weaveBump(){
  const N = 256, [c, x] = canvas(N, N);
  for (let y = 0; y < N; y++) for (let X = 0; X < N; X++){
    const v = 128 + 40 * Math.sin(X * Math.PI / 2) * Math.sin(y * Math.PI / 2 + (X >> 2) % 2 * Math.PI) + (rng() - .5) * 50;
    x.fillStyle = `rgb(${v|0},${v|0},${v|0})`; x.fillRect(X, y, 1, 1);
  }
  return tex(c, {srgb: false});
}
function oakTex(){
  const W = 512, H = 1024, [c, x] = canvas(W, H);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#caa774'); g.addColorStop(.5, '#d4b282'); g.addColorStop(1, '#c6a06c');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 230; i++){
    const px = R(0, W), w = R(.6, 3.5), dark = rng() < .55;
    x.strokeStyle = dark ? `rgba(122,84,44,${R(.12, .38).toFixed(2)})` : `rgba(236,214,174,${R(.1, .3).toFixed(2)})`; x.lineWidth = w;
    x.beginPath(); x.moveTo(px, -10);
    const f = R(.002, .008), amp = R(2, 14), ph = R(0, 6);
    for (let y = 0; y <= H + 10; y += 16) x.lineTo(px + Math.sin(y * f + ph) * amp, y);
    x.stroke();
  }
  grain(x, W, H, 10);
  return tex(c);
}
function barkTex(){
  const W = 256, H = 512, [c, x] = canvas(W, H);
  x.fillStyle = '#6f6253'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++){
    const px = R(0, W), l = R(30, 160), py = R(-40, H);
    x.strokeStyle = rng() < .5 ? `rgba(48,40,32,${R(.25, .6).toFixed(2)})` : `rgba(150,138,118,${R(.2, .45).toFixed(2)})`;
    x.lineWidth = R(1, 4); x.beginPath(); x.moveTo(px, py); x.bezierCurveTo(px + R(-6, 6), py + l * .3, px + R(-6, 6), py + l * .6, px + R(-4, 4), py + l); x.stroke();
  }
  grain(x, W, H, 18);
  return tex(c, {repeat: [2, 3]});
}
function leafTex(){
  const N = 256, [c, x] = canvas(N, N);
  const greens = ['#2f5a22', '#3a6a28', '#467632', '#2a521e', '#557f38'];
  x.strokeStyle = '#5b5a34'; x.lineWidth = 3; x.beginPath(); x.moveTo(128, 254); x.quadraticCurveTo(122, 140, 130, 26); x.stroke();
  const leaf = (px, py, ang, len, wid) => {
    x.save(); x.translate(px, py); x.rotate(ang);
    const g = x.createLinearGradient(0, 0, 0, -len), col = greens[(rng() * greens.length) | 0];
    g.addColorStop(0, col); g.addColorStop(1, '#6f9a4a');
    x.fillStyle = g; x.beginPath(); x.moveTo(0, 0);
    x.bezierCurveTo(wid, -len * .25, wid * .8, -len * .75, 0, -len);
    x.bezierCurveTo(-wid * .8, -len * .75, -wid, -len * .25, 0, 0); x.fill();
    x.strokeStyle = 'rgba(205,230,160,.35)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(0, -2); x.lineTo(0, -len * .92); x.stroke();
    x.restore();
  };
  for (let i = 0; i < 10; i++){
    const t = i / 10, py = 236 - t * 200, side = i % 2 ? 1 : -1;
    leaf(126 + side * 2, py, side * deg(R(42, 62)), 74 - t * 26 + R(-6, 6), 21 - t * 4);
  }
  leaf(130, 30, R(-.15, .15), 50, 17);
  return tex(c);
}
function frondTex(){
  const W = 128, H = 512, [c, x] = canvas(W, H);
  x.strokeStyle = '#4f6d2c'; x.lineWidth = 3; x.beginPath(); x.moveTo(64, H); x.lineTo(64, 4); x.stroke();
  for (let t = .06; t < .985; t += .028){
    const py = H - t * H, len = 58 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.08)), .55) * (1 - .3 * t);
    for (const s of [-1, 1]){
      x.save(); x.translate(64, py); x.rotate(s * deg(68 - t * 18));
      x.fillStyle = rng() < .5 ? '#517f33' : '#5f8f3d';
      x.beginPath(); x.ellipse(0, -len / 2, Math.max(2, len * .14), len / 2, 0, 0, Math.PI * 2); x.fill();
      x.restore();
    }
  }
  return tex(c);
}
function mulchTex(){
  const N = 256, [c, x] = canvas(N, N);
  x.fillStyle = '#3b2c20'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 1400; i++){ x.fillStyle = `rgba(${R(70, 120)|0},${R(48, 80)|0},${R(30, 50)|0},${R(.4, .9).toFixed(2)})`; x.fillRect(R(0, N), R(0, N), R(2, 9), R(1, 3)); }
  grain(x, N, N, 20);
  return tex(c, {repeat: [3, 3]});
}
function stepTex(){ // escalator tread grooves
  const [c, x] = canvas(64, 256);
  x.fillStyle = '#3a3c3f'; x.fillRect(0, 0, 64, 256);
  for (let i = 0; i < 64; i += 4){ x.fillStyle = '#25272a'; x.fillRect(i, 0, 2, 256); }
  x.fillStyle = '#c9a336'; x.fillRect(0, 0, 64, 10); // yellow nosing line
  return tex(c);
}
function blob(x, cx, cy, r, color, alpha, stretch = 1, rot = 0){
  const k = 9, pts = [];
  for (let i = 0; i < k; i++){ const a = i / k * Math.PI * 2, rr = r * R(.65, 1.2); pts.push([Math.cos(a) * rr * stretch, Math.sin(a) * rr]); }
  x.save(); x.translate(cx, cy); x.rotate(rot); x.globalAlpha = alpha; x.fillStyle = color; x.beginPath();
  for (let i = 0; i <= k; i++){
    const p = pts[i % k], q = pts[(i + 1) % k], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    if (i === 0) x.moveTo(m[0], m[1]); else x.quadraticCurveTo(p[0], p[1], m[0], m[1]);
  }
  x.fill(); x.restore();
}
function radialTex(stops, N = 512){
  const [c, x] = canvas(N, N), g = x.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0, 0, N, N);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; return t;
}
function poufPattern(kind){
  const W = 1024, H = 512, [c, x] = canvas(W, H);
  if (kind === 'patch'){
    x.fillStyle = '#dd5a1b'; x.fillRect(0, 0, W, H);
    x.filter = 'blur(2px)';
    for (const cx of [0, W]) blob(x, cx + 260, 40, 210, '#a7b48d', 1, 2.4, .05);
    blob(x, 760, 30, 150, '#a7b48d', 1, 2.2, -.05);
    blob(x, 560, 70, 90, '#d9c48a', .9, 2.0, .1);
  } else {
    x.fillStyle = '#b9bb88'; x.fillRect(0, 0, W, H);
    x.filter = 'blur(2px)';
    const P = [['#dc5a1c', 210, 330, 260], ['#97a87c', 640, 250, 230], ['#e6a320', 470, 120, 140], ['#dc5a1c', 860, 360, 200],
               ['#a9b88a', 120, 90, 170], ['#d9c27e', 780, 90, 170], ['#e46a24', 380, 380, 150]];
    for (const [col, px, py, r] of P) for (const ox of [-W, 0, W]) blob(x, px + ox, py, r, col, 1, 1.7, R(-.4, .4));
  }
  x.filter = 'none'; grain(x, W, H, 8);

function roundedBox(w, h, d, r, seg, deform, tile = .2){

    q.set(clamp(v.x, -e[0], e[0]), clamp(v.y, -e[1], e[1]), clamp(v.z, -e[2], e[2]));
    v.sub(q).normalize().multiplyScalar(r).add(q);

}

const dims = new THREE.Group(); scene.add(dims);
function tag(text, sub, x, y, z){
  const el = document.createElement('div'); el.className = 'tag';
  el.innerHTML = `<b></b><div>${text}${sub ? `<small>${sub}</small>` : ''}</div>`;
  const o = new CSS2DObject(el); o.position.set(x, y + S.rug, z); dims.add(o);
}
tag('قطر الكنبة 260 سم', '12 وحدة × 30°', ...(([x, z]) => [x, .45, z])(polar(-60, 1.3)));
{ const [x, z] = polar(-18, 1.24); tag('ارتفاع الجلوس 42 سم', 'عمق 55', x, .43, z); }
{ const [x, z] = polar(-40, .7); tag('الظهر 75 سم', 'سماكة 15', x, .76, z); }
{ const [x, z] = polar(8, .59); tag('حافة الحوض 85 سم', 'قطر الحوض 120', x, .86, z); }
tag('الشجرة ≈ 233 سم', 'عرض التاج ≈ 180', 0, 2.36, 0);
{ const [x, z] = poufPos.mixed; tag('بوف Ø50', 'ارتفاع 42', x, .45, z); }
{ const [x, z] = tablePos[2]; tag('طاولة Ø40', 'ارتفاع 52', x, .53, z); }
const dimBtn = document.getElementById('dimBtn');
function showDims(v){ dims.visible = v; dims.children.forEach(c => c.visible = v); dimBtn.setAttribute('aria-pressed', v); dirty = true; }
showDims(false);
dimBtn.onclick = () => showDims(!dims.visible);

// ------------------------------------------------------------ navigation: look + walk, or orbit around the seating
const look = {yaw: 0, pitch: 0};
let mode = 'look', tween = null;
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enabled = false; orbit.enableDamping = true; orbit.dampingFactor = .08; orbit.target.set(0, .9, 0);
orbit.minDistance = 1.6; orbit.maxDistance = 22; orbit.maxPolarAngle = deg(88);
function applyLook(){ camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ'); }
function syncLookFromCamera(){ const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); look.yaw = e.y; look.pitch = e.x; }
function clampPos(p){ p.x = clamp(p.x, B.x0 + .6, B.x1 - .6); p.z = clamp(p.z, B.z0 + .6, B.z1 - .6); p.y = clamp(p.y, .35, SKY_Y - .6); }

const ptrs = new Map(); let pinch0 = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 2) pinch0 = pinchDist(); stopTween(); hideHint(); });
addEventListener('pointerup', e => ptrs.delete(e.pointerId)); addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
cv.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (mode !== 'look') return;
  if (ptrs.size === 1){
    const k = .0032 * camera.fov / 70;
    look.yaw += dx * k; look.pitch = clamp(look.pitch + dy * k, -1.52, 1.4); dirty = true;
  } else if (ptrs.size === 2){
    const d = pinchDist(); moveForward((d - pinch0) * .02); pinch0 = d;
  }
});
function pinchDist(){ const [a, b] = [...ptrs.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); }
cv.addEventListener('wheel', e => { if (mode !== 'look') return; e.preventDefault(); stopTween(); moveForward(-Math.sign(e.deltaY) * Math.min(2.5, Math.abs(e.deltaY) * .006)); }, {passive: false});
function moveForward(d){
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  camera.position.addScaledVector(dir, d); clampPos(camera.position); dirty = true;
}
const held = new Set();
const KEYS = {KeyW: 'fwd', ArrowUp: 'fwd', KeyS: 'back', ArrowDown: 'back', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyE: 'up', PageUp: 'up', KeyQ: 'down', PageDown: 'down'};
addEventListener('keydown', e => { const k = KEYS[e.code]; if (!k) return; e.preventDefault(); held.add(k); if (e.shiftKey) held.add('fast'); leaveOrbit(); stopTween(); hideHint(); });
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) held.delete(k); if (!e.shiftKey) held.delete('fast'); });
addEventListener('blur', () => held.clear());
document.querySelectorAll('[data-move]').forEach(b => {
  const k = b.dataset.move;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); held.add(k); b.classList.add('on'); leaveOrbit(); stopTween(); hideHint(); });
  const off = () => { held.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
function stepMove(dt){
  if (!held.size || mode !== 'look') return false;
  const sp = (held.has('fast') ? 7 : 3.2) * dt, f = V(-Math.sin(look.yaw), 0, -Math.cos(look.yaw)), r = V(Math.cos(look.yaw), 0, -Math.sin(look.yaw));
  const p = camera.position;
  if (held.has('fwd')) p.addScaledVector(f, sp); if (held.has('back')) p.addScaledVector(f, -sp);
  if (held.has('right')) p.addScaledVector(r, sp); if (held.has('left')) p.addScaledVector(r, -sp);
  if (held.has('up')) p.y += sp; if (held.has('down')) p.y -= sp;
  clampPos(p); return true;
}

// viewpoints
function photoView(){
  const portrait = camera.aspect < .8;
  return {pos: [0, 6.9, 7.7], target: portrait ? [0, 3.6, -10] : [0, .6, -1.6], fov: portrait ? 92 : 58};
}
const VIEWS = {
  photo: photoView,
  orbit: () => ({pos: [6.2, 4.2, 7.6], target: [0, .9, 0], fov: camera.aspect < .8 ? 70 : 52, orbit: true}),
  ground: () => ({pos: [4.4, 1.6, 6.2], target: [0, .95, 0], fov: camera.aspect < .8 ? 78 : 60}),
  escal: () => ({pos: [14.75, L1.top + 1.65, -.9], target: [0, .7, 0], fov: camera.aspect < .8 ? 78 : 58}),
  far: () => ({pos: [0, L1.top + 1.65, -9.3], target: [0, .7, 1], fov: camera.aspect < .8 ? 84 : 62}),
  top: () => ({pos: [0, SKY_Y - 1.2, .01], target: [0, 0, 0], fov: camera.aspect < .8 ? 70 : 55}),
};
let curView = 'photo';
function setPressed(name){ document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name)); }
function leaveOrbit(){ if (mode === 'orbit'){ mode = 'look'; orbit.enabled = false; syncLookFromCamera(); } setPressed(''); curView = null; }
function stopTween(){ if (tween && !tween.toOrbit){ tween = null; } }
function goView(name, instant){
  curView = name; setPressed(name);
  if (mode === 'orbit'){ orbit.enabled = false; mode = 'look'; syncLookFromCamera(); }
  const v = VIEWS[name](), pos = V(...v.pos), d = V(...v.target).sub(pos);
  const yaw = Math.atan2(-d.x, -d.z), pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches){
    camera.position.copy(pos); look.yaw = yaw; look.pitch = pitch; camera.fov = v.fov; camera.updateProjectionMatrix(); applyLook();
    if (v.orbit) enterOrbit(); dirty = true; return;
  }
  const dy = Math.atan2(Math.sin(yaw - look.yaw), Math.cos(yaw - look.yaw));
  tween = {k: 0, p0: camera.position.clone(), p1: pos, y0: look.yaw, y1: look.yaw + dy, a0: look.pitch, a1: pitch, f0: camera.fov, f1: v.fov, toOrbit: !!v.orbit};
}
function enterOrbit(){ mode = 'orbit'; orbit.target.set(0, .9, 0); orbit.enabled = true; orbit.update(); }
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => goView(b.dataset.view));

// ------------------------------------------------------------ quality, resize, screenshot
const padBtn = document.getElementById('padBtn'), padEl = document.getElementById('pad');
function showPad(v){ padEl.hidden = !v; padBtn.setAttribute('aria-pressed', v); }
showPad(!(isSmall && matchMedia('(max-width: 640px)').matches));
padBtn.onclick = () => showPad(padEl.hidden);
const hqBtn = document.getElementById('hqBtn');
function setHQ(v){
  hq = v; hqBtn.setAttribute('aria-pressed', v); reflOn.value = v ? 1 : 0;
  if (v && !composer) buildComposer();
  resize();
}
hqBtn.onclick = () => setHQ(!hq);
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labels.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  reflRT.setSize(Math.round(w * pr * .5), Math.round(h * pr * .5));
  if (composer){ composer.setPixelRatio(pr); composer.setSize(w, h); }
  dirty = true;
}
addEventListener('resize', () => { resize(); if (curView && !tween) goView(curView, true); });
function draw(){
  renderReflection();
  if (hq && composer) composer.render(); else renderer.render(scene, camera);
  labels.render(scene, camera);
}
document.getElementById('shotBtn').onclick = () => {
  draw();
  const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'mall-seating-unit.png'; a.click();
};
const hint = document.getElementById('hint');
let hintHidden = false;
function hideHint(){ if (!hintHidden){ hintHidden = true; hint.style.opacity = 0; } }

// ------------------------------------------------------------ start
setHQ(hq);
goView('photo', true);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now(), first = true;
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  let moved = false;
  if (tween){
    tween.k = Math.min(1, tween.k + dt / 1.1); const e = ease(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    look.yaw = THREE.MathUtils.lerp(tween.y0, tween.y1, e); look.pitch = THREE.MathUtils.lerp(tween.a0, tween.a1, e);
    camera.fov = THREE.MathUtils.lerp(tween.f0, tween.f1, e); camera.updateProjectionMatrix(); applyLook(); moved = true;
    if (tween.k >= 1){ const o = tween.toOrbit; tween = null; if (o) enterOrbit(); }
  } else if (mode === 'orbit'){
    moved = orbit.update();
  } else {
    moved = stepMove(dt); applyLook();
  }
  if (!(moved || dirty)) return;
  dirty = false;
  draw();
  if (first){
    first = false; const l = document.getElementById('loading'); l.style.opacity = 0; l.style.pointerEvents = 'none'; setTimeout(() => l.remove(), 800);
    setTimeout(hideHint, 7000);
  }
});
</script>
